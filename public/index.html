<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfcfe">
  <title>{{APP_NAME}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-title" content="{{SHORT_NAME}}">
  <meta name="powered-by" content="{{POWERED_BY}}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/brand.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="signed-out">
  <header class="topbar">
    <a class="wordmark" href="#/">{{APP_NAME}}</a>
    <div class="topbar-actions">
      <button class="theme-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="theme-track" aria-hidden="true">
          <span class="theme-thumb">
            <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
            <svg class="moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
          </span>
        </span>
      </button>
      <button class="text-button" id="sign-out" type="button">Sign out</button>
    </div>
  </header>
  <div class="notice" id="notice" role="status" hidden></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home">Home</a>
    <a href="#/customers" data-tab="customers">Customers</a>
    <a href="#/calendar" data-tab="calendar">Calendar</a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
